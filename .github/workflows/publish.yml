name: Publish Release

on:
  release:
    types: [published]

concurrency:
  group: npm-package-publish
  cancel-in-progress: false

# id-token write is what lets the shared workflow publish to npm through the trusted publisher,
# which names this file, so renaming it breaks publishing.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: Florian-Noever/Florian-Noever/.github/workflows/npm-package-publish.yml@v1
    with:
      check-command: npm run check-types && npm run lint
      test-command: npm test && npm run test:e2e
